version: '3'

services:
  db:
    image: mysql:8.0
    restart: always
    env_file:
      - ./mysql/.env # 使用了环境变量文件
    volumes:
      - db_vol:/var/lib/mysql:rw # 挂载数据库数据, 可读可写
      - ./mysql/my.cnf:/etc/mysql/my.cnf # 挂载配置文件
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql # 挂载数据初始化sql脚本
    ports:
      - "3307:3306"
    networks:
      - db_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
  web:
    build:
      context: ./frontend/
    volumes:
      - ./frontend:/app
    networks:
      - db_network
      - nginx_network
  # 备份服务
  backup:
    image: alpine:latest  # 使用更轻量的 alpine 镜像
    restart: always
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups:rw
      - ./scripts/backup.sh:/scripts/backup.sh:ro
    networks:
      - db_network
    # 创建独立的启动脚本
    command: >
      sh -c '
      apk add --no-cache mysql-client bash curl dcron
      echo "等待数据库启动..."
      sleep 30
      echo "测试数据库连接..."
      until mysql -hdb -uroot -p$${MYSQL_ROOT_PASSWORD} -e "SELECT 1" 2>/dev/null
      do
        echo "等待数据库..."
        sleep 5
      done
      echo "创建定时备份任务..."
      mkdir -p /etc/periodic/daily
      cat > /etc/periodic/daily/backup << "EOF"
      #!/bin/sh
      /scripts/backup.sh daily
      EOF
      chmod +x /etc/periodic/daily/backup
      echo "执行首次备份..."
      /scripts/backup.sh daily
      echo "启动定时任务服务..."
      crond -f -l 8
      '
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
  backend:
    build: ./django
    restart: always
    volumes:
      - ./django:/app:rw
      - ./uwsgi:/tmp
    depends_on:
      - db
    networks:
      - db_network
      - nginx_network
    ports:
      - "8000:8000"
  nginx:
    build: ./nginx
    ports:
      - "8081:8080"
      - "443:443"
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf # 挂载nginx配置文件
      - ./nginx/log:/var/log/nginx # 挂载日志
      - ./frontend:/usr/share/nginx/html # 挂载静态文件
      - ./django/media:/usr/share/nginx/html/media:ro # 挂载 Django 媒体文件（只读）
    networks:
      - nginx_network
    depends_on:
      - web
      - backend
    restart: always


networks: # 自定义网络(默认桥接), 不使用links通信
  db_network:
    driver: bridge
  nginx_network:
    driver: bridge
volumes: # 自定义数据卷
  db_vol: #定义数据卷同步存放容器内mysql数据

